name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile all sources
        run: python -m compileall -q app

      - name: Import smoke test
        env:
          TELEGRAM_BOT_TOKEN: "123456:TEST-TOKEN"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/finza"
          SECRET_KEY: "ci-test-secret"
        run: |
          python - <<'PY'
          import importlib

          for module in [
              "app.config",
              "app.utils.money",
              "app.services.parser",
              "app.services.categorizer",
              "app.services.auth",
              "app.bot.handlers",
              "app.routes.auth",
              "app.routes.dashboard",
              "app.main",
          ]:
              importlib.import_module(module)
              print(f"ok  {module}")
          PY
