services:
  postgres:
    image: postgres:15
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      - POSTGRES_USER=finza
      - POSTGRES_PASSWORD=finza_troque_depois
      - POSTGRES_DB=expenses
    ports:
      - "5434:5432"
    volumes:
      - finza_tg_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.free
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  finza_tg_pgdata:
